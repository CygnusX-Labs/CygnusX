# ============================================
# OmicHub AI Provider 外置配置示例
# ============================================
# 复制为 data/ai_providers.yaml 并填入真实 API Key。
# 支持 ${ENV_VAR} 或 ${ENV_VAR:-default} 语法引用环境变量，
# 因此 API Key 可以继续放在 .env 中，而 Provider 列表由本文件管理。
#
# 启动时系统会自动将本文件同步到数据库；
# 管理员仍可在"系统设置 → AI 模型配置"中查看/修改/测试。

providers:
  - name: aliyun
    provider_type: openai_compatible
    model: qwen3.7-max
    base_url: https://llm-i1uekbihz77q045m.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
    api_key: ${AL_API_KEY}
    temperature: 0.7
    max_tokens: 4096
    top_p: 1.0
    timeout: 120
    is_default: true
    is_active: true
    extra_params: {}

