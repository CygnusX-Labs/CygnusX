# ============================================================
# OmicHub 节日彩蛋系统配置文件
# 版本: 1.0
# 说明: 管理员可通过此文件配置节日彩蛋、弹窗、额度赠送
# 路径: data/festival_config.yaml
# ============================================================

version: "1.0"

# ── 全局配置 ──
global:
  # 系统总开关（紧急情况下可一键关闭）
  enabled: true

  # 默认生效时间范围
  defaultActiveWindow:
    start: "00:00:00"
    end: "23:59:59"

  # 弹窗全局默认配置
  popupDefaults:
    showOncePerUser: true        # 每个用户只展示一次
    showMaxTimes: 3              # 最多展示次数
    dismissible: true            # 是否可关闭
    backdropClose: true          # 点击遮罩关闭
    escClose: true               # ESC键关闭

  # 额度赠送全局限制
  quotaDefaults:
    expiryDays: 30               # 赠送额度有效期（天）

# ── 节日列表 ──
festivals:
  # ═══════════════════════════════════════════════════════════
  # 农历节日
  # ═══════════════════════════════════════════════════════════
  - id: spring_festival
    name: "春节"
    nameEn: "Spring Festival"
    category: "traditional"
    calendarType: "lunar"
    lunarDate: { month: 1, day: 1 }
    activeRange: { offsetDays: -1, durationDays: 7 }
    popup:
      enabled: true
      title: "🎊 新春大吉"
      content: |
        在这辞旧迎新的时刻，愿星光为你指引前路。
        送你 {{bonusAmount}} 饼干大礼包！
      primaryButton:
        text: "立即领取 ✨"
        action: "claim_quota"
      secondaryButton:
        text: "了解更多"
        action: "navigate"
        link: "/about"
      animation:
        enabled: true
        type: "fireworks"
        duration: 15
    quotaBonus:
      enabled: true
      amount: 1000
      unit: "cookie"
      description: "春节特别赠送"
    priority: 100
    enabled: true

  - id: lantern_festival
    name: "元宵节"
    nameEn: "Lantern Festival"
    category: "traditional"
    calendarType: "lunar"
    lunarDate: { month: 1, day: 15 }
    popup:
      enabled: true
      title: "🏮 元宵喜乐"
      content: "花灯如昼，月圆人团圆。送你 {{bonusAmount}} 饼干！"
      animation:
        enabled: true
        type: "confetti"
        duration: 15
    quotaBonus:
      enabled: true
      amount: 200
      unit: "cookie"
    priority: 80
    enabled: true

  - id: dragon_boat
    name: "端午节"
    nameEn: "Dragon Boat Festival"
    category: "traditional"
    calendarType: "lunar"
    lunarDate: { month: 5, day: 5 }
    popup:
      enabled: true
      title: "🐲 端午安康"
      content: "粽叶飘香，龙舟竞渡。送你 {{bonusAmount}} 饼干！"
      animation:
        enabled: true
        type: "confetti"
        duration: 8
    quotaBonus:
      enabled: true
