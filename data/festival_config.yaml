# ── 动画类型定义 ──
animationTypes:
  fireworks:
    name: "烟花"
    description: "全屏烟花动画"
    library: "canvas-confetti"
  snow:
    name: "雪花"
    description: "飘雪效果"
    library: "css"
  confetti:
    name: "彩纸"
    description: "五彩纸屑庆祝"
    library: "canvas-confetti"
  star_heart:
    name: "星河爱心"
    description: "星星汇聚成爱心"
    library: "canvas-confetti"
  moon_glow:
    name: "月光"
    description: "月亮发光+星云效果"
    library: "css"
  petal:
    name: "花瓣"
    description: "花瓣飘落"
    library: "css"
  code_rain:
    name: "代码雨"
    description: "黑客帝国风格代码雨"
    library: "css"
  lantern:
    name: "灯笼"
    description: "灯笼飘动"
    library: "css"
