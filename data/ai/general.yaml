# 通用助手
agent_id: agent-general
name: 通用助手
description: 覆盖日常问答与通用生信咨询的全能助手。
avatar: "\U0001F916"
color: "#4f8ef7"
category: general
model: qwen3.7-plus
prompt_file: prompts/general.md
welcome_message: "你好！我是通用助手，可以帮你解答生信分析的一般问题。今天想做点什么？"
temperature: 0.7
max_tokens: 4096
mcp_ids: []
skill_ids:
  # 通用生信工具技能（来源：pipelines/tools/skills/）
  - blast
  - genome-tools
  - atac-tools
  - maftools-gistic2
  - mutational-patterns
features:
  engine: langgraph
  managed_prompt: true
  subagents_spawnable: true  # 可作为并行子 Agent 被 fan-out 派生
  default_role: 任务 intake、研究目标拆解、总体研究计划与数据契约
  capability_scope: [需求澄清, 研究设计, 数据契约, 跨专家协调, 综合方案]
  capability_tags: [intake, research-design, data-contract, quality-control, synthesis]
  accepts_inputs: [research-question, modality, group-definition, sample-metadata]
  produces_outputs: [research-plan, data-contract, quality-control-plan]
  default_stage: research-plan
  web_search:
    mode: required_for_freshness
    # 通用时效词全部由运行时基线 FRESHNESS_SEARCH_TRIGGERS 覆盖，无需重复声明
    triggers: []
tool_packs: [workspace, research, memory, handoff, subagents, agentteams_case]
handoff:
  allowed_targets: ["*"]
  max_hops_per_session: 10

studio:
  enabled: true
  runtime_profile: analysis-core
  required_capabilities: [python, r, bash]
