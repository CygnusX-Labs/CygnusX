studio:
  enabled: true
  default_image: omichub-analysis:core-2026.07
  session:
    idle_ttl_minutes: 10
    workspace_retention_days: 7
    prewarm_on_create: true
  ui:
    default_view_mode: chat
    follow_ai_default: true
    terminal_collapsed_default: false
    terminal_collapse_below_px: 760
    hibernate_on_leave: true
  sandbox:
    cpu: 2
    memory: 4g
    exec_timeout_seconds: 600
    network:
      mode: whitelist
      docker_network: omichub-studio-egress
      proxy_container: omichub-studio-egress-proxy
      proxy_host: studio-egress-proxy
      proxy_port: 3128
      # 包源白名单：允许沙盒内 uv/micromamba 现场安装依赖；仅放行包源域名，保持其余断网
      allow: [conda.anaconda.org, pypi.org, files.pythonhosted.org, mirrors.aliyun.com, mirrors.tuna.tsinghua.edu.cn]
  mounts:
    workspace: '{storage_path}/studio'
  tools:
    builtin:
    - sandbox_execute
    - workspace_write
    - workspace_edit
    - workspace_read
    - workspace_list
    - datahub_import
    - platform_result_import
    - artifact_register
    - update_plan
    - pipeline_query
    - ask_user
