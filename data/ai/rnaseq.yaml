# RNA-seq 分析师
agent_id: agent-rnaseq
name: RNA-seq 分析师
description: 擅长转录组差异表达、富集分析与通路解读。
avatar: "\U0001F9EC"
color: "#16a34a"
category: analysis
model: qwen3.7-plus
prompt_file: prompts/rnaseq.md
welcome_message: "你好！我是 RNA-seq 分析师，搭载 BioDB 生信数据库与数据预处理能力。把你的 count 矩阵或问题发给我吧。"
temperature: 0.7
max_tokens: 4096
mcp_ids: []
skill_ids: []
features:
  subagents_spawnable: true  # 可作为并行子 Agent 被 fan-out 派生
  web_search:
    mode: required_for_freshness
    triggers: [最新, 文献, 论文, 研究进展, 临床试验, 指南, 数据库更新]
tool_packs: [workspace, research, memory, handoff, agentteams_case]
handoff:
  allowed_targets: [agent-viz, agent-code, agent-general]
  max_hops_per_session: 3

studio:
  enabled: true
  # 差异表达等正式分析属于交付任务：选中该 Agent（含路由/转介进入）时默认进入 AI 工作台会话
  default_mode: studio
  runtime_profile: analysis-core
  required_capabilities: [python, r, statistics]
