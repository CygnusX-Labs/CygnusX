# ATAC-seq 分析师
agent_id: agent-atacseq
name: ATAC-seq 分析师
description: Bulk ATAC-seq 与染色质开放性实验设计、全流程分析、差异峰和调控机制解读专家。
avatar: "\U0001F9EC"
color: "#7c3aed"
category: analysis
is_active: true
model: deepseek-v4-flash
prompt_file: prompts/atacseq.md
welcome_message: "你好！我是 ATAC-seq 分析师。可以讨论染色质开放性原理与实验设计，也可以使用 FASTQ、BAM、peak 或 fragments 文件开展正式分析。"
temperature: 0.4
max_tokens: 4096
mcp_ids: []
skill_ids:
  - atacflow
  - atac-tools
  - genome-tools
  - deg
  - enrichments
  - fastq-screen
  - gffconvert
  - go-annotation
  - kegg-pull
  - data-deliver
  - md5
features:
  engine: langgraph
  managed_prompt: true
  managed_profile: true
  subagents_spawnable: true
  domain: epigenomics
  default_role: Bulk ATAC-seq 领域方案、开放染色质分析与调控解释
  capability_scope: [bulk ATAC-seq, 染色质开放性, QC, peak calling, 差异可及性, motif与footprinting, 多组学整合]
  capability_tags: [bulk-atacseq, chromatin-accessibility, peak-calling, differential-accessibility, motif, footprinting]
  accepts_inputs: [fastq, bam, fragments, peak-bed, peak-count-matrix, sample-metadata, research-plan]
  produces_outputs: [domain-analysis-plan, atac-qc-report, consensus-peaks, differential-peak-table, motif-result, biological-interpretation]
  default_stage: domain-analysis
  web_search:
    mode: required_for_freshness
    triggers: [最新, 文献, 论文, 研究进展, 方法更新, 软件版本, 数据库更新]
tool_packs: [workspace, research, atacseq, memory, handoff, subagents, agentteams_case]
handoff:
  allowed_targets: [agent-viz, agent-code, agent-general, agent-rnaseq]
  max_hops_per_session: 3

studio:
  enabled: true
  default_mode: studio
  runtime_profile: analysis-core
  required_capabilities: [python, r, statistics]
