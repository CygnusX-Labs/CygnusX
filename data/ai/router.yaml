# 智能路由器：统一对话入口，自动识别需求并转接对应专家
agent_id: agent-router
name: 星尘 AI
description: 统一入口：由星尘 AI 理解任务并分派给最合适的专家。
avatar: "🧭"
color: "#8e6cf0"
category: general
model: qwen3.7-plus
prompt_file: prompts/router.md
welcome_message: "你好，我是星尘 AI。直接描述目标或当前问题，我会判断任务并分派给合适的专家。"
temperature: 0.7
max_tokens: 4096
mcp_ids: []
skill_ids: []
features:
  router: true
  web_search:
    mode: required_for_freshness
    triggers: [实时, 最新, 今天, 新闻, 天气, 文献, 论文, 研究进展]
tool_packs: [workspace, agentteams_case]

# Studio 工作台：router 会话共享一个沙盒镜像（取最通用的 analysis-core）。
# 注意：转接到 scrna 等专家后仍使用该镜像；按被路由专家动态切换镜像是后续工作。
studio:
  enabled: true
  runtime_profile: analysis-core
  required_capabilities: [python, r, bash]
