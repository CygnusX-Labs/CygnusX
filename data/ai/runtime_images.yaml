version: 1
selection:
  # 这是“没有 Agent 专用画像且没有用户显式覆盖”时的最后兜底 profile。
  # 它不是所有 Agent 的强制镜像，也不能覆盖 data/ai/*.yaml 的 studio.runtime_profile。
  # 修改 default_profile、profile image/tag 或选择策略前，必须先向用户确认，
  # 因为这会影响全部未显式声明画像的会话。
  default_profile: analysis-core
  strategy: capability_match
  reject_unknown_profile: true
  prefer_smallest_satisfying_image: true

profiles:
  analysis-core:
    name: 通用多语言分析运行时
    image: cygnusx-analysis:core-v0.0.2dev
    family: cygnusx-analysis
    isolation_class: task-analysis
    runtime_uid: 10001
    runtime_gid: 10001
    runtime_group: cygnusx-sandbox
    dockerfile: deploy/runtime-images/core.Dockerfile
    executor_compatibility: [studio, toolbox]
    description: 基于 micromamba 的隔离分析镜像，提供 Python/R/Bash 和通用统计、表格处理能力；默认无外网，不能直接访问 GEO/NCBI/EBI。
    capabilities: [python, r, bash, tabular, statistics, machine-learning]
    task_tags: [general, code, rnaseq-basic, statistics]
    languages:
      python: "3.12"
      r: "4.4"
    software:
      micromamba: "2.0.5"
      pandas: "2.2.3"
      numpy: "2.1.3"
      scipy: "1.14.1"
      scikit-learn: "1.5.2"
      statsmodels: "0.14.4"
      pyyaml: "6.0.2"
      bioconductor-deseq2: "1.46.0"
      r-edgeR: "4.4.0"
      r-limma: "3.62.1"
    resources: {cpu: 2, memory: 4g, pids: 512}
    network_policy: none
    tools_manifest_digest: null

  analysis-plot:
    # 可视化 Agent 的专用构建镜像。agent-viz 在 data/ai/viz.yaml 中显式绑定此 profile；
    # 不得因 Studio 请求未带 browser/document 能力而回退到 analysis-core 或 browser-office。
    # 若要更换 tag、Dockerfile 或依赖，先向用户确认并同步核验 plot.Dockerfile、软件清单和
    # 现有会话兼容性。
    name: 科研绘图运行时
    image: cygnusx-analysis:plot-v0.0.2dev
    family: cygnusx-analysis
    isolation_class: task-analysis
    runtime_uid: 10001
    runtime_gid: 10001
    runtime_group: cygnusx-sandbox
    dockerfile: deploy/runtime-images/plot.Dockerfile
    extends: analysis-core
    executor_compatibility: [studio, toolbox]
    description: 面向 publication-ready 绘图，提供 Python/R 静态与交互式图形栈、ggtree 系统发育树绘图及字体支持。
    capabilities: [python, r, bash, tabular, statistics, plotting, interactive-plotting, phylogenetics]
    task_tags: [visualization, report, volcano, heatmap, enrichment-plot, phylogenetic-tree, ggtree]
    software:
      matplotlib: "3.9.2"
      seaborn: "0.13.2"
      plotly: "5.24.1"
      r-ggplot2: "3.5.1"
      r-dplyr: "installed"
      r-stringr: "installed"
      r-ggrepel: "installed"
      r-ggpubr: "0.6.0"
      bioconductor-ggtree: "installed"
      bioconductor-treeio: "installed"
      r-ape: "installed"
      r-patchwork: "1.3.0"
      r-plotly: "4.10.4"
    resources: {cpu: 2, memory: 4g, pids: 512}
    network_policy: none
    tools_manifest_digest: null

  analysis-scrna:
    name: 单细胞分析运行时
    image: cygnusx-analysis:scrna-v0.0.3dev
    family: cygnusx-analysis
    isolation_class: task-analysis-heavy
    runtime_uid: 10001
    runtime_gid: 10001
    runtime_group: cygnusx-sandbox
    dockerfile: deploy/runtime-images/scrna.Dockerfile
    extends: analysis-plot
    executor_compatibility: [studio, toolbox]
    description: 面向单细胞 RNA-seq 的隔离镜像，提供 Scanpy/AnnData、Seurat 5.5、降维、聚类、注释和 HDF5 读写；默认无外网。
    capabilities: [python, r, bash, tabular, statistics, plotting, single-cell, hdf5]
    task_tags: [scrna, scanpy, seurat, clustering, annotation, trajectory]
    software:
      scanpy: "1.10.4"
      anndata: "0.11.1"
      leidenalg: "0.10.2"
      python-igraph: "0.11.8"
      r-seurat: "5.5.1"
      r-ggpubr: "0.6.0"
      bioconductor-singlecellexperiment: "1.28.0"
    resources: {cpu: 4, memory: 12g, pids: 1024}
    network_policy: none
    tools_manifest_digest: null

  analysis-rnaseq:
    name: RNA-seq 分析运行时
    image: cygnusx-analysis:rnaseq-v0.0.1dev
    family: cygnusx-analysis
    isolation_class: task-analysis-heavy
    runtime_uid: 10001
    runtime_gid: 10001
    runtime_group: cygnusx-sandbox
    dockerfile: deploy/runtime-images/rnaseq.Dockerfile
    extends: analysis-core
    executor_compatibility: [studio, toolbox]
    description: 面向 bulk RNA-seq 的比对、定量和跨样本 QC 运行时。
    capabilities: [python, r, bash, tabular, statistics, machine-learning, ngs, rnaseq, qc]
    task_tags: [rnaseq, alignment, quantification, qc]
    software:
      star: ">=2.7"
      salmon: ">=1.10"
      rsem: ">=1.3"
      samtools: ">=1.20"
      fastp: ">=0.23"
      multiqc: ">=1.24"
      subread: ">=2.0"
    resources: {cpu: 8, memory: 32g, pids: 1024}
    network_policy: none
    tools_manifest_digest: null

  analysis-atacseq:
    name: ATAC-seq 分析运行时
    image: cygnusx-analysis:atacseq-v0.0.1dev
    family: cygnusx-analysis
    isolation_class: task-analysis-heavy
    runtime_uid: 10001
    runtime_gid: 10001
    runtime_group: cygnusx-sandbox
    dockerfile: deploy/runtime-images/atacseq.Dockerfile
    extends: analysis-core
    executor_compatibility: [studio, toolbox]
    description: 面向 ATAC-seq 比对、峰识别、信号计算和质量控制的运行时。
    capabilities: [python, r, bash, tabular, statistics, machine-learning, ngs, atacseq, qc]
    task_tags: [atacseq, alignment, peak-calling, differential-accessibility, qc]
    software:
      bowtie2: ">=2.5"
      chromap: ">=0.2"
      macs2: ">=2.2"
      samtools: ">=1.20"
      bedtools: ">=2.31"
      deeptools: ">=3.5"
      fastp: ">=0.23"
      multiqc: ">=1.24"
    resources: {cpu: 8, memory: 32g, pids: 1024}
    network_policy: none
    tools_manifest_digest: null

  analysis-qc:
    name: 测序质量控制运行时
    image: cygnusx-analysis:qc-v0.0.1dev
    family: cygnusx-analysis
    isolation_class: task-analysis
    runtime_uid: 10001
    runtime_gid: 10001
    runtime_group: cygnusx-sandbox
    dockerfile: deploy/runtime-images/qc.Dockerfile
    extends: analysis-core
    executor_compatibility: [studio, toolbox]
    description: 面向 FASTQ、BAM、VCF 和跨样本报告的通用测序质量控制运行时。
    capabilities: [python, r, bash, tabular, statistics, ngs, qc]
    task_tags: [qc, fastq, bam, vcf, multiqc]
    software:
      fastqc: ">=0.12"
      fastp: ">=0.23"
      multiqc: ">=1.24"
      samtools: ">=1.20"
      bcftools: ">=1.20"
      deeptools: ">=3.5"
      qualimap: ">=2.3"
      fastq-screen: ">=0.16"
    resources: {cpu: 4, memory: 16g, pids: 1024}
    network_policy: none
    tools_manifest_digest: null

  bio:
    name: Studio 生物信息学沙盒
    image: cygnusx-sandbox-bio:v0.0.2dev
    family: cygnusx-sandbox
    isolation_class: studio-session
    runtime_uid: 10001
    runtime_gid: 10001
    runtime_group: cygnusx-sandbox
    dockerfile: deploy/studio/bio.Dockerfile
    executor_compatibility: [studio]
    description: Studio 生物信息学镜像，提供单细胞分析、序列处理和常用 NGS 命令行工具。
    capabilities: [python, bash, tabular, statistics, plotting, interactive-plotting, machine-learning, single-cell, hdf5, bioinformatics]
    task_tags: [studio, bioinformatics, scrna, scanpy, alignment, blast]
    languages:
      python: "3.12"
    software:
      scanpy: "installed"
      anndata: "installed"
      pysam: "installed"
      bioinfokit: "installed"
      ncbi-blast+: "installed"
      samtools: "installed"
      bedtools: "installed"
      seqkit: "optional"
    resources: {cpu: 4, memory: 8g, pids: 1024}
    network_policy: whitelist

  browser-office:
    name: Studio 浏览器文档沙盒
    image: cygnusx-sandbox-browser-office:v0.0.2dev
    family: cygnusx-sandbox
    isolation_class: studio-session
    runtime_uid: 10001
    runtime_gid: 10001
    runtime_group: cygnusx-sandbox
    dockerfile: deploy/studio/browser-office.Dockerfile
    executor_compatibility: [studio]
    description: Studio 浏览器与办公文档镜像，提供 Chromium、Playwright、LibreOffice 和 Word/PPTX 处理能力。
    capabilities: [python, bash, tabular, statistics, plotting, interactive-plotting, machine-learning, single-cell, hdf5, bioinformatics, browser, document]
    task_tags: [studio, browser, document, office, libreoffice, playwright]
    languages:
      python: "3.12"
    software:
      playwright: "installed"
      chromium: "installed"
      libreoffice: "installed"
      python-docx: "installed"
      python-pptx: "installed"
    resources: {cpu: 2, memory: 8g, pids: 1024}
    network_policy: whitelist

boundaries:
  forbidden_consumers: [legacy-sandbox-pool, interactive-terminal-pool]
  notes:
    - 镜像层可被 Studio 与工具箱任务执行器共同引用，但不得复用容器、容器池、会话或挂载。
    - Studio 必须继续使用会话工作区、非 root 用户、Unix Socket agent 和休眠回收协议。
    - 工具箱必须按工具任务创建独立容器，并使用工具自己的输入输出契约和资源限制。
    - Agent 共享统一的沙盒工具契约，但按 required_capabilities 选择一个满足任务的 profile；
      不把所有镜像、浏览器能力和网络出口同时授予同一会话。
    - analysis-* 默认 network_policy=none；需要公共数据库元数据时使用经前端审批的
      network_request 工具，browser-office 的浏览器能力仍须显式匹配 browser capability。
