# 代码助手
agent_id: agent-code
name: 代码助手
description: 生信脚本编写、调试与沙盒执行一体化。
avatar: "\U0001F4BB"
color: "#a855f7"
category: code
model: qwen3.7-plus
prompt_file: prompts/code.md
welcome_message: "你好！我是代码助手，挂载了 Code Sandbox 与数据预处理、图表绘制技能。需要写或跑哪段代码？"
temperature: 0.7
max_tokens: 4096
mcp_ids: []
skill_ids:
  # 工程类工具技能（来源：pipelines/tools/skills/）
  - software-manager
  - logger-plugin
  - md5
  - data-deliver
features:
  subagents_spawnable: true  # 可作为并行子 Agent 被 fan-out 派生
  default_role: 把上游方案实现为可复现代码并在沙盒执行
  capability_scope: [Python, R, Bash, 脚本设计, 调试, 沙盒执行]
  capability_tags: [python, r, bash, reproducible-code, debugging, sandbox-execution]
  accepts_inputs: [research-plan, domain-analysis-plan, data-contract, workspace-files]
  produces_outputs: [analysis-script, execution-log, result-table, reproducibility-notes]
  default_stage: code-design
  web_search:
    mode: required_for_freshness
    # 仅声明基线（FRESHNESS_SEARCH_TRIGGERS）之外的领域增量词
    triggers: [版本, 发布说明, API, 文档]
tool_packs: [workspace, handoff, subagents, agentteams_case]
handoff:
  allowed_targets: [agent-general, agent-rnaseq, agent-scrna, agent-viz]
  max_hops_per_session: 10

studio:
  enabled: true
  # 选中该 Agent 时默认直接进入 AI 工作台（Studio）会话，而非普通聊天
  default_mode: studio
  runtime_profile: analysis-core
  required_capabilities: [python, r, bash]
