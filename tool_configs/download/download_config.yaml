# CygnusX 统一下载器配置
# 修改后由 DownloadConfigManager 按文件 mtime 自动热重载，无需重启。

features:
  ebi: false
  cloud_storage: false
  direct_link: false

# 留空使用对应 Settings/env 配置，未覆盖时由 STORAGE_PATH 派生。
# 显式填写绝对路径时，该值仍优先于 env。
binaries:
  ebi: ""
  ebi_config: ""
  aria2c: ""
  ossutil: ""
  tosutil: ""
  obsutil: ""

aria2:
  default_threads: 4
  max_threads: 16
  max_concurrent_downloads: 4
  max_tries: 5
  retry_wait: 5
  connect_timeout: 30
  timeout: 60
  file_allocation: "none"
  check_integrity: true
  ftp_reuse_connection: true

validation:
  max_links_per_task: 100
  allowed_schemes: ["http", "https", "ftp"]
