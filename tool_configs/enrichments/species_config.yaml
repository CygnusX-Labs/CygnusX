# ============================================
# OmicHub 富集分析物种配置（KEGG / GO）
# ============================================
# 修改本文件后由配置加载器基于 mtime 自动热重载，无需重启后端。
#
# 字段说明：
#   id            物种唯一标识，前端下拉 value（提交时作为 species_id 传回）
#   display_name  展示名称；后端序列化为前端 SpeciesOption.label
#   enabled       是否在前端下拉可见（false 则隐藏，不参与提交）
#   kegg_code     KEGG API 物种三字码，如 hsa / ath（传入容器 --kegg_code）
#   org_db        R OrgDb 包名，如 org.Hs.eg.db（传入容器 --org_db）
#   id_type       基因 ID 类型，如 SYMBOL / TAIR（传入容器 --id_type）
#   kegg_rdata    离线 KEGG.RData 路径（预留，在线失败时 enricher fallback 用）
#   kegg_supported 该物种是否被 KEGG 注释覆盖（预留，前端灰度用）
#
# 新增物种：在 species_list 下追加一项即可，无需改代码。
# 注意：org_db 对应的 R 包必须已安装进富集分析镜像（见 docs/26.7.6/KEGG_Docker_契约.md）。
# --------------------------------------------

species_list:
  - id: "human"
    display_name: "Homo sapiens (人类)"
    enabled: true
    kegg_code: "hsa"
    org_db: "org.Hs.eg.db"
    id_type: "SYMBOL"
    kegg_rdata: null
    kegg_supported: true

  - id: "arabidopsis"
    display_name: "Arabidopsis thaliana (拟南芥)"
    enabled: true
    kegg_code: "ath"
    org_db: "org.At.tair.db"
    id_type: "TAIR"
    kegg_rdata: null
    kegg_supported: true
