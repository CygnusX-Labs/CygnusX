# CygnusX CI：lint + 单测 + 契约测试（tests/unit 内含 test_dual_registry_contract.py）
# + e2e 套件（tests/e2e 默认可跑用例）+ Bridge 独立测试工程 + 前端测试/类型检查。
# 存量失败用例打 @pytest.mark.quarantine 隔离（-m "not quarantine"），
# 逐条归因见 docs/info/26.8.21/协作室测试quarantine-burn-down-2026-08-21.md。
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端（ruff + pytest tests/unit + tests/e2e）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: 安装依赖
        run: uv sync --frozen
      - name: ruff check
        run: uv run ruff check src/ tests/
      - name: pytest（单测 + 契约 + 默认可跑 e2e）
        run: uv run pytest tests/unit tests/e2e -q -m "not quarantine"

  bridge:
    name: AgentTeams Bridge（独立 pytest 工程）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/agentteams/bridge
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: 安装依赖
        run: uv sync --frozen
      - name: pytest
        run: uv run pytest -q

  frontend:
    name: 前端（vitest + vue-tsc）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: vitest
        run: npx vitest run
      - name: vue-tsc 类型检查
        run: npx vue-tsc --noEmit
