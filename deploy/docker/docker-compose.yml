# ============================================
# OmicHub Docker Compose - 开发环境
# 用法: docker compose -f deploy/docker/docker-compose.yml up -d
# ============================================

services:
  # ===== 反向代理 =====
  nginx:
    image: nginx:alpine
    container_name: omichub-nginx
    restart: unless-stopped
    ports:
      - "8888:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - web
    networks:
      - app_net

  # ===== FastAPI 主应用 =====
  web:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: omichub-web
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      - APP_ENV=development
      - POSTGRES_HOST=db
      - REDIS_HOST=cache
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    volumes:
      - ../../src:/app/src:ro  # 开发环境热重载
      - ../../flows:/app/flows:ro  # 流程 YAML 配置（热重载）
      - ../../data:/app/data:ro  # AI Provider YAML 配置（热重载）
      - shared_storage:/data/omichub
    networks:
      - app_net
      - data_net
    command: uvicorn omichub.main:app --host 0.0.0.0 --port 8000 --reload

  # ===== Celery Worker =====
  worker:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: omichub-worker
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      - APP_ENV=development
      - POSTGRES_HOST=db
      - REDIS_HOST=cache
    depends_on:
      - web
    volumes:
      - ../../src:/app/src:ro  # 开发环境热重载
      - shared_storage:/data/omichub
    networks:
      - app_net
      - data_net
    command: celery -A omichub.infrastructure.celery_app.celery worker --loglevel=info
    healthcheck:
      test: ["CMD-SHELL", "celery -A omichub.infrastructure.celery_app.celery inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # ===== Celery Beat 定时器 =====
  beat:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: omichub-beat
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      - APP_ENV=development
      - POSTGRES_HOST=db
      - REDIS_HOST=cache
    depends_on:
      - worker
    volumes:
      - ../../src:/app/src:ro  # 开发环境热重载
    networks:
      - app_net
      - data_net
    command: celery -A omichub.infrastructure.celery_app.celery beat --loglevel=info
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os; os.kill(1, 0)\" || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # ===== Flower 监控 =====
  flower:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: omichub-flower
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      - APP_ENV=development
      - POSTGRES_HOST=db
      - REDIS_HOST=cache
    ports:
      - "5555:5555"
    depends_on:
      - worker
    networks:
      - app_net
      - data_net
    command: celery -A omichub.infrastructure.celery_app.celery flower --port=5555
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5555/"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # ===== PostgreSQL =====
  db:
    image: postgres:14-alpine
    container_name: omichub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: omichub
      POSTGRES_PASSWORD: omichub_dev_password
      POSTGRES_DB: omichub
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - data_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omichub"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== Redis =====
  cache:
    image: redis:7-alpine
    container_name: omichub-cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - data_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  app_net:
    driver: bridge
  data_net:
    driver: bridge

volumes:
  pg_data:
  redis_data:
  shared_storage:
