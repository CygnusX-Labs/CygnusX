# OmicHub Nginx 配置 - 开发环境

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;

    # ===== Gzip 压缩（首次加载核心优化，1.7MB JS → ~480KB）=====
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json application/xml
               application/rss+xml application/atom+xml image/svg+xml
               font/woff font/woff2 application/font-woff application/font-woff2;

    # WebSocket 支持
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 限流
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    upstream omichub_backend {
        server web:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # 前端静态资源根目录（开发环境挂载 frontend/dist）
        root /usr/share/nginx/html;
        index index.html;

        # API 代理（同时支持 HTTP 与 WebSocket Upgrade）
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://omichub_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400;  # WebSocket 长连接超时
        }

        # 健康检查
        location /health {
            proxy_pass http://omichub_backend;
        }

        # API 文档（开发环境）
        location /docs {
            proxy_pass http://omichub_backend;
        }

        # Flower 监控代理
        location /flower/ {
            proxy_pass http://flower:5555/;
            proxy_set_header Host $host;
        }

        # 静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # 根路径 - SPA fallback（前端构建产物不存在时 404）
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # index.html 禁止缓存，避免更新后浏览器仍加载旧 JS
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
}
