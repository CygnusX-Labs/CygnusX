# 前端容器 Nginx 配置

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json application/xml
               image/svg+xml font/woff font/woff2;

    # Native Vue entry; legacy account/chat/assets below the old SPA stay private.
    location = /treasure-mouse {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /treasure-mouse/ {
        return 302 /treasure-mouse$is_args$args;
    }
    location ^~ /treasure-mouse/ {
        return 404;
    }

    # SPA 路由 - history 模式
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The module entry is stable; only fingerprinted child assets are immutable.
    location = /treasure-island/treasure-island.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
