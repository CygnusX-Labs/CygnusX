# ============================================
# OmicHub Docker Compose - 跨机部署 Worker 计算栈覆盖
# 用法:
#   docker compose \
#     -f deploy/docker/docker-compose.worker.yml \
#     -f deploy/docker/docker-compose.cross-worker.yml \
#     up -d
#
# 前置条件:
#   1. Worker 服务器已挂载 /data/omichub (NFS)。
#   2. 已配置 .env，且 Web 服务器真实 IP 已替换下方 10.0.0.10。
#   3. Worker 服务器能访问 Web 服务器的 5432/6379/8000 端口。
# ============================================

services:
  worker:
    environment:
      - APP_ENV=production
      # 跨机访问必须使用 Web 服务器的真实 IP
      - POSTGRES_HOST=10.0.0.10
      - REDIS_HOST=10.0.0.10
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@10.0.0.10:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@10.0.0.10:6379/2
      - SERVICE_NAME=worker
      - OMICHUB_LOG_DIR=/app/logs
      - OMICHUB_CELERY_LOG_DIR=/data/omichub/logs/celery/tasks
      # 流程监控 token：优先 OMICHUB_WORKFLOW_MONITOR_TOKEN，否则 fallback 到 WORKFLOW_MONITOR_INGEST_TOKEN
      - OMICHUB_WORKFLOW_MONITOR_TOKEN=${OMICHUB_WORKFLOW_MONITOR_TOKEN:-${WORKFLOW_MONITOR_INGEST_TOKEN}}
      # 关键：流程监控 ingest URL 必须指向 Web 服务器真实地址
      - WORKFLOW_MONITOR_INTERNAL_URL=http://10.0.0.10:8000/api/v1/workflow-monitor
    # Worker 不需要加入 Web 侧的外部网络，使用本机默认 bridge 即可
    networks:
      - default

# 覆盖原文件中的 external network，避免 Worker 服务器因缺少外部网络而启动失败
networks:
  omichub_net:
    external: false
    driver: bridge
