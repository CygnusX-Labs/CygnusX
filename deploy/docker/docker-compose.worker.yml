# ============================================
# OmicHub 计算节点栈（独立编排）——仅 Celery Worker
# 单机逻辑解耦：与主栈 (docker-compose.yml) 通过外部网络 omichub_net 共享 Redis
# 用法: docker compose -f deploy/docker/docker-compose.worker.yml up -d
# 生产水平扩展: docker compose -f deploy/docker/docker-compose.worker.yml --scale worker=2 up -d
#
# 前置:
#   1. docker network create omichub_net      # 外部网络（主栈已声明同名 external）
#   2. 主栈已启动，且 cache 服务已加入 omichub_net
#   3. mkdir -p /data/omichub                  # 任务数据目录（首次部署）
#   4. 宿主 conda 实际在 /home/zj/miniconda3，分析 env 在 /home/zj/.local/share/mamba/envs
# ============================================
services:
  worker:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: omichub-worker
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"   # 以宿主用户运行，避免 root；任务数据/conda envs 文件归宿主所有
    env_file:
      - ../../.env
    environment:
      - APP_ENV=development
      - POSTGRES_HOST=db
      - REDIS_HOST=cache                 # 经 omichub_net 解析主栈 Redis 服务名
      - CELERY_BROKER_URL=redis://cache:6379/1
      - CELERY_RESULT_BACKEND=redis://cache:6379/2
      - AL_API_KEY=${AL_API_KEY}
      - ARK_API_KEY=${ARK_API_KEY}
      - HOME=/tmp                        # uid 1000 无 passwd 条目，显式 HOME 防 conda/expanduser 失败
      # 优先用宿主 conda 的 snakemake（python3.13，与 RNAFlow 实跑一致），回退镜像 venv
      - PATH=/home/zj/miniconda3/envs/snakemake/bin:/home/zj/miniconda3/bin:/app/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      # conda 环境创建目录（可写）：--use-conda 时按 env hash 在此创建/复用，避免只读挂载冲突
      - SNAKEMAKE_CONDA_PREFIX=/data/omichub/.conda_envs
    volumes:
      # —— 核心共享存储（模拟分布式共享盘，与主栈 web 共用）——
      - /data/omichub:/data/omichub                       # 任务数据读写
      - /home/zj/pipeline:/home/zj/pipeline:ro            # Snakemake 流程代码
      - ../../src:/app/src:ro                            # 开发热重载：与 web/beat 一致，代码改动重启即生效（免重建镜像）
      - ../../alembic:/app/alembic:ro                    # 迁移脚本（与 web/beat 一致，便于排障时 exec alembic）
      # —— conda 运行时（只读，原位挂载以匹配 shebang 绝对路径）——
      - /home/zj/miniconda3:/home/zj/miniconda3:ro        # 含 bin/conda、envs/snakemake
      - /home/zj/.local/share/mamba:/home/zj/.local/share/mamba:ro   # RNAFlow 各分析工具 env
    networks:
      - omichub_net
    # -Q analysis: 显式消费 analysis 队列（task_routes 把全部任务路由到此队列）。
    #   不加 -Q 时 worker 只消费内置默认队列 "celery"，会导致 analysis 队列里的任务永远排队。
    command: celery -A omichub.infrastructure.celery_app.celery worker -Q analysis --loglevel=info
    healthcheck:
      test: ["CMD-SHELL", "celery -A omichub.infrastructure.celery_app.celery inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

networks:
  omichub_net:
    external: true
