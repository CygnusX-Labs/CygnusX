services:
  omichub-agentteams-bridge:
    build:
      context: ../../integrations/agentteams/bridge
    command: ["uvicorn", "omichub_agentteams_bridge.app:app", "--host", "0.0.0.0", "--port", "8080"]
    env_file:
      - ${BRIDGE_ENV_FILE:-./bridge.env}
    ports:
      - "${AGENTTEAMS_BRIDGE_BIND_HOST:-127.0.0.1}:${AGENTTEAMS_BRIDGE_PORT:-8088}:8080"
    volumes:
      - agentteams_bridge_audit:/var/lib/omichub-agentteams-bridge
    networks: [agentteams_control, omichub_bridge_gateway]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test:
        ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  agentteams_control:
    name: omichub_agentteams_control
    internal: true
  omichub_bridge_gateway:
    name: ${OMICHUB_BRIDGE_GATEWAY_NETWORK:-omichub_bridge_gateway}
    external: true

volumes:
  agentteams_bridge_audit:
